<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>ربط Pollinations | AI-ONE</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e1b;color:#f2f5fc;font-family:system-ui,sans-serif;padding:20px}.box{max-width:520px;background:#111b2d;border:1px solid #34435e;border-radius:18px;padding:25px;line-height:1.9}a{color:#c8c0ff}#status{color:#f5c84b}
</style></head>
<body><main class="box"><h2>ربط حساب Pollinations</h2><p id="status">جارٍ تأكيد الموافقة وربط الحساب...</p><p><a href="./article-studio.html">العودة إلى استوديو AI-ONE</a></p></main>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const returnedState=params.get('state');
  const expectedState=sessionStorage.getItem('pollinations_oauth_state');
  const verifier=sessionStorage.getItem('pollinations_pkce_verifier');
  const clientId='pk_EDn5OVAUvDpuFlWT';
  const redirectUri='https://ai-one-app.github.io/ai-one-app/pollinations-callback.html';
  if(params.get('error'))throw new Error(params.get('error_description')||params.get('error'));
  if(!code||!returnedState||!expectedState||returnedState!==expectedState||!verifier)throw new Error('تعذر التحقق من جلسة الربط. ارجع للاستوديو وحاول الربط مرة أخرى.');
  const response=await fetch('https://enter.pollinations.ai/api/oauth/token',{
   method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
   body:new URLSearchParams({grant_type:'authorization_code',code,client_id:clientId,redirect_uri:redirectUri,code_verifier:verifier})
  });
  const data=await response.json();
  if(!response.ok||!data.access_token)throw new Error(data.error_description||data.error||'فشل تبادل رمز الموافقة.');
  sessionStorage.setItem('pollinations_access_token',data.access_token);
  sessionStorage.removeItem('pollinations_pkce_verifier');
  sessionStorage.removeItem('pollinations_oauth_state');
  status.textContent='تم ربط الحساب بنجاح. جارٍ إعادتك إلى الاستوديو...';
  history.replaceState(null,'',location.pathname);
  location.replace('./article-studio.html');
 }catch(error){status.textContent='لم يكتمل الربط: '+error.message+' — ارجع للاستوديو وحاول مرة أخرى.';}
})();
</script></body></html>
